name: Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t knowledge-layer-api:ci .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build stack images
        run: docker compose build api web jobworker connectorworker
