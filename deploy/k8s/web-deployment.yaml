apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-web
  namespace: knowledge-layer
  labels:
    app.kubernetes.io/name: knowledge-layer
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-layer
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-layer
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Replace with your published image (build via `docker build -f Dockerfile.web .`).
          # NOTE: NEXT_PUBLIC_* are inlined at BUILD time, not runtime — bake your API URL
          # into the image when you build, or supply it as a build-arg in your CI.
          image: ghcr.io/your-org/knowledge-layer-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # Web app does not need the API secrets, only the public-side config.
          envFrom:
            - configMapRef:
                name: knowledge-layer-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Next.js needs writable .next/cache by default.
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-web
  namespace: knowledge-layer
  labels:
    app.kubernetes.io/name: knowledge-layer
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knowledge-layer
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
