apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-jobworker
  namespace: knowledge-layer
  labels:
    app.kubernetes.io/name: knowledge-layer
    app.kubernetes.io/component: jobworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-layer
      app.kubernetes.io/component: jobworker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-layer
        app.kubernetes.io/component: jobworker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jobworker
          image: ghcr.io/your-org/knowledge-layer-api:latest
          imagePullPolicy: IfNotPresent
          # Override default ENTRYPOINT — the multi-binary image ships all three.
          command: ["/app/knowledge-jobworker"]
          ports:
            - name: health
              containerPort: 9001
          envFrom:
            - configMapRef:
                name: knowledge-layer-config
            - secretRef:
                name: knowledge-layer-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Service exists only so port-forward / Prometheus scrape works against /ops/health.
# The asynq listener is outbound (Redis), so no external traffic enters via this Service.
apiVersion: v1
kind: Service
metadata:
  name: knowledge-jobworker
  namespace: knowledge-layer
  labels:
    app.kubernetes.io/name: knowledge-layer
    app.kubernetes.io/component: jobworker
spec:
  type: ClusterIP
  clusterIP: None  # Headless — direct pod access for /ops/health.
  selector:
    app.kubernetes.io/name: knowledge-layer
    app.kubernetes.io/component: jobworker
  ports:
    - name: health
      port: 9001
      targetPort: 9001
      protocol: TCP
