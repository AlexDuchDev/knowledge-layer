# TEMPLATE — do NOT commit a populated copy of this file.
#
# Either:
#   a) `kubectl -n knowledge-layer create secret generic knowledge-layer-secrets --from-literal=...`
#      (see deploy/k8s/README.md for the canonical command), OR
#   b) feed values via external-secrets / Sealed Secrets / SOPS / your platform's secret manager.
#
# Every key listed here is referenced by api-deployment.yaml / jobworker-deployment.yaml /
# connectorworker-deployment.yaml / web-deployment.yaml. ValidateAPI / ValidateWorker reject
# startup if a required value is missing under APP_ENV=production (see docs/PRODUCTION_HARDENING.md).

apiVersion: v1
kind: Secret
metadata:
  name: knowledge-layer-secrets
  namespace: knowledge-layer
  labels:
    app.kubernetes.io/name: knowledge-layer
type: Opaque
stringData:
  # --- REQUIRED in production ---

  # Postgres DSN. Use sslmode=verify-full with a CA bundle in real environments.
  DATABASE_URL: "postgres://knowledge:CHANGE_ME@db.internal:5432/knowledge?sslmode=require"

  # Redis URL. Required for queue-backed jobs and webhook-triggered ingestion.
  REDIS_URL: "redis://redis.internal:6379/0"

  # Session signing secret. Min 16 bytes effective (raw or hex); recommend 32 hex bytes.
  # Generate: openssl rand -hex 32
  SESSION_SECRET: "CHANGE_ME"

  # Gates /ops/health and /metrics outside APP_ENV=local. Min 16 chars trimmed.
  # Generate: openssl rand -hex 24
  OPS_AUTH_TOKEN: "CHANGE_ME"

  # AES-256 vault key for the AI privacy gateway. 32 raw bytes or base64 of 32 bytes.
  # Generate: openssl rand -base64 32
  AI_PRIVACY_VAULT_KEY: "CHANGE_ME"

  # Comma-separated origins permitted by the API. Production must be explicit.
  CORS_ALLOW_ORIGINS: "https://kl.example.com"

  # LLM provider key (one of these).
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""

  # --- OPTIONAL ---

  # SMTP for invitation / magic-link emails. Leave empty to log emails only.
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""

  # GraphRAG (optional module). Set NEO4J_URL in ConfigMap *and* credentials here to enable.
  NEO4J_USER: ""
  NEO4J_PASSWORD: ""

  # Second Brain (optional module). See docs/OSS_V1_SCOPE.md "Optional modules".
  SECOND_BRAIN_WEBHOOK_SECRET: ""
  TELEGRAM_BOT_TOKEN: ""
  MATTERMOST_OUTGOING_WEBHOOK_TOKEN: ""

  # Connector OAuth credentials (Gmail / Microsoft 365). Empty disables authorize-url.
  GMAIL_OAUTH_CLIENT_ID: ""
  GMAIL_OAUTH_CLIENT_SECRET: ""
  MICROSOFT_OAUTH_CLIENT_ID: ""
  MICROSOFT_OAUTH_CLIENT_SECRET: ""

  # S3-compatible blob store (optional; defaults to in-process Nop).
  BLOBSTORE_BACKEND: ""
  BLOBSTORE_S3_ENDPOINT: ""
  BLOBSTORE_S3_REGION: ""
  BLOBSTORE_S3_BUCKET: ""
  BLOBSTORE_S3_ACCESS_KEY: ""
  BLOBSTORE_S3_SECRET_KEY: ""
